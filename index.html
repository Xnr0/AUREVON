<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREVON | Define The Absolute</title>
    <style>
        /* রাজকীয় ম্যাট ব্ল্যাক ও গোল্ডেন থিম */
        body {
            margin: 0;
            padding: 0;
            background-color: #0B0B0B;
            color: #FFFFFF;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
        }
        
        /* হেডার সেকশন */
        header {
            padding: 40px 20px;
            border-bottom: 1px solid #D4AF37;
        }
        
        .logo {
            font-size: 45px;
            letter-spacing: 8px;
            color: #D4AF37;
            margin: 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(212, 175, 55, 0.3);
        }

        .slogan {
            font-size: 16px;
            letter-spacing: 4px;
            color: #A0A0A0;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* হিরো ব্যানার */
        .hero {
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 32px;
            color: #FFFFFF;
            margin-bottom: 20px;
        }

        /* প্রোডাক্ট সেকশন */
        .product-box {
            background-color: #141414;
            border: 1px solid #D4AF37;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
        }

        .product-title {
            color: #D4AF37;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .product-desc {
            color: #CCCCCC;
            font-size: 16px;
            line-height: 1.6;
        }

        .price {
            font-size: 22px;
            color: #D4AF37;
            margin: 20px 0;
            font-weight: bold;
        }

        /* মেম্বারশিপ বাটন */
        .btn {
            background-color: #D4AF37;
            color: #0B0B0B;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #FFFFFF;
            color: #0B0B0B;
            box-shadow: 0px 0px 15px #D4AF37;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">AUREVON</h1>
        <div class="slogan">Define The Absolute</div>
    </header>

    <section class="hero">
        <h2>The Golden Launch</h2>
        
        <div class="product-box">
            <h3 class="product-title">Noire: Edible 24K Gold Truffle Box</h3>
            <p class="product-desc">
                বিশ্বের সবচেয়ে দুর্লভ হোয়াইট ট্রাফল ও ডার্ক চকলেটের এক রাজকীয় ফিউশন, যা আবৃত খাঁটি খাওয়ার উপযোগী ২৪ ক্যারেট সোনার পাতে। প্রতিটি বক্স একটি কাস্টম-মেড ব্ল্যাক ভেলভেট কেসে হ্যান্ডক্রাফটেড করা হয়।
            </p>
            <div class="price">$250 USD</div>
            <button class="btn">Enter The Empire</button>
        </div>
    </section>

</body>
</html>
